name: Render & Supabase 8-Minute Keep-Alive Heartbeat

on:
  schedule:
    # Runs every 8 minutes (or closest UTC slot supported by GitHub Actions)
    - cron: '*/8 * * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target API endpoint to ping'
        required: false
        default: 'https://aayuyukthi-api.onrender.com'

jobs:
  heartbeat:
    name: Ping Render & Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send Keep-Alive Wakeup Ping
        env:
          DEFAULT_URL: ${{ secrets.RENDER_API_URL || 'https://aayuyukthi-api.onrender.com' }}
          INPUT_URL: ${{ github.event.inputs.target_url }}
        run: |
          URL="${INPUT_URL:-$DEFAULT_URL}"
          CLEAN_URL="${URL%/}"
          ENDPOINT="$CLEAN_URL/api/v1/health/heartbeat"
          echo "Pinging keep-alive endpoint: $ENDPOINT"
          HTTP_STATUS=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            -H "User-Agent: GitHub-Actions-KeepAlive/1.0" \
            --connect-timeout 15 \
            --max-time 30 \
            "$ENDPOINT" || echo "FAILED")
          echo "HTTP Status Code: $HTTP_STATUS"
          if [ -f /tmp/response.json ]; then
            cat /tmp/response.json
          fi
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Heartbeat successful: Render kept awake & Supabase activity recorded."
          else
            echo "⚠️ Non-200 status or timeout received: $HTTP_STATUS"
          fi
